name: Release

# Pushing a `v*` tag publishes a GitHub release for it. Nothing is deployed:
# the edge and console bundles bake in their deployment's config at apply time,
# so there is no build artifact worth attaching — consumers pin the Terraform
# modules to the tag (`?ref=v1.0.0`) and build their own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same gate a merge to `dev` goes through, so a tag on a broken commit
  # fails here instead of publishing a release of it.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes are built from the history since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The workspace versions are bumped in the PR before tagging, so a tag
      # that disagrees with them was cut from the wrong commit.
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      # A hyphenated tag (v1.1.0-rc.1) is published as a pre-release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            $prerelease
