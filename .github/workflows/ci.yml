name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by deploy-dev.yml before it applies anything. A push to `dev` does not
  # trigger this workflow on its own, so without this the deploy would be the
  # first thing to run against a merge commit — and the first to find out it is
  # broken, after it had already started changing infrastructure.
  workflow_call:

jobs:
  lint:
    name: Lint (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (tsc --noEmit) + API bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The UI's API types are generated from console/api/openapi.yaml and
      # committed. Regenerate and fail if the result differs, so a spec or
      # shared-schema edit cannot leave the client typed against a stale
      # contract that still compiles.
      - run: npm run generate:api:check --workspace console/ui
      # Exercise the esbuild bundle so ESM output / JSON imports / externals
      # can't break unnoticed until a real deploy.
      - run: npm run build -w console/api

  schemas:
    name: Validate shared schemas + OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run openapi:lint -w console/api

  e2e:
    name: Console E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chromium only. These assert on this app's own focus handling, storage
      # and event order, not on anything that differs between engines, so more
      # browsers would re-prove the same assertions at triple the minutes.
      - run: npx playwright install --with-deps chromium
        working-directory: console/ui
      # Runs against `vite dev` with every /api call stubbed in the page — no
      # console API, no AWS, no DynamoDB table.
      - run: npm run test:e2e --workspace console/ui
      # Traces and screenshots for whatever failed; useless when it passes.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: console/ui/playwright-report/
          retention-days: 7

  terraform:
    name: Terraform (fmt + validate + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
      - run: terraform fmt -check -recursive infra
      - run: terraform fmt -check -recursive examples
      - run: terraform fmt -check -recursive console
      # The backend stub and the per-environment tfvars the deploy workflow uses.
      - run: terraform fmt -check -recursive deploy
      - run: terraform -chdir=infra/modules/table init -backend=false
      - run: terraform -chdir=infra/modules/table validate
      - run: terraform -chdir=infra/modules/table test
      # The edge module uses a configuration_aliases provider, so it can't
      # `validate` as a standalone root; the mocked test covers it instead.
      - run: terraform -chdir=infra/modules/edge init -backend=false
      - run: terraform -chdir=infra/modules/edge test
      - run: terraform -chdir=examples/infra init -backend=false
      - run: terraform -chdir=examples/infra validate
      - run: terraform -chdir=examples/infra test
      - run: terraform -chdir=console/api/infra init -backend=false
      - run: terraform -chdir=console/api/infra validate
      - run: terraform -chdir=console/api/infra test
      # The console's hosting. No variables needed: validate does not evaluate
      # them, and the test suite supplies its own throwaway credential.
      - run: terraform -chdir=console/ui/infra init -backend=false
      - run: terraform -chdir=console/ui/infra validate
      - run: terraform -chdir=console/ui/infra test
