openapi: 3.1.0
info:
  title: EdgeRoute Console API
  version: 0.1.0
  description: >-
    Control-plane API for managing CloudFront redirect/rewrite rules stored in
    DynamoDB. Rule request and response bodies reference the shared JSON Schemas
    in `shared/` — the single source of truth for rule shapes; they are never
    redefined here.


    The targets registry (ER-202) is implemented. Rule routes are defined ahead
    of their handlers (ER-203) and return `501` until then.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
    description: Relative to the deployed HTTP API stage.
tags:
  - name: system
    description: Operational endpoints.
  - name: targets
    description: Registry of DynamoDB tables (targets) the console manages.
  - name: rules
    description: Redirect and rewrite rule management, scoped to a target and host.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      description: Returns 200 while the API is serving. Unauthenticated.
      tags: [system]
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /targets:
    get:
      operationId: listTargets
      summary: List all targets.
      tags: [targets]
      responses:
        "200":
          description: All registered targets, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      summary: Register a new target.
      tags: [targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: The created target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/BadRequest"
  /targets/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetPathId"
    get:
      operationId: getTarget
      summary: Fetch a single target.
      tags: [targets]
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateTarget
      summary: Update a target.
      tags: [targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "200":
          description: The updated target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTarget
      summary: Remove a target from the registry.
      description: >-
        Removes the target from the registry only — its actual DynamoDB rules
        table is never deleted.
      tags: [targets]
      responses:
        "204":
          description: The target was removed from the registry.
        "404":
          $ref: "#/components/responses/NotFound"
  /targets/{targetId}/hosts/{host}/rules:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - $ref: "#/components/parameters/Host"
    get:
      operationId: listRules
      summary: List a host's rules by priority.
      description: Redirect and rewrite rules for the host, in sort-key order.
      tags: [rules]
      responses:
        "200":
          description: The host's rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createRule
      summary: Create a rule for a host.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rule"
      responses:
        "201":
          description: The created rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /targets/{targetId}/hosts/{host}/rules/{sk}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - $ref: "#/components/parameters/Host"
      - $ref: "#/components/parameters/Sk"
    get:
      operationId: getRule
      summary: Fetch a single rule.
      tags: [rules]
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: putRule
      summary: Replace a rule.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rule"
      responses:
        "200":
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteRule
      summary: Delete a rule.
      tags: [rules]
      responses:
        "204":
          description: The rule was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  parameters:
    TargetPathId:
      name: id
      in: path
      required: true
      description: Target id.
      schema:
        type: string
        minLength: 1
    TargetId:
      name: targetId
      in: path
      required: true
      description: Target (DynamoDB table) id from the targets registry (ER-202).
      schema:
        type: string
        minLength: 1
    Host:
      name: host
      in: path
      required: true
      description: Rule host — the DynamoDB partition key, e.g. www.example.com.
      schema:
        type: string
        minLength: 1
    Sk:
      name: sk
      in: path
      required: true
      description: Sort key — TYPE#priority, e.g. REDIRECT#00100.
      schema:
        type: string
        minLength: 1
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    TargetInput:
      description: Fields a client supplies to create or update a target.
      type: object
      additionalProperties: false
      required: [name, region, tableName]
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable target name.
        region:
          type: string
          pattern: "^[a-z]{2}(-[a-z]+)+-\\d+$"
          description: >-
            AWS region of the target's DynamoDB table. Validated server-side
            against a curated list of real regions — the format pattern here is
            necessary but not sufficient (e.g. us-east-11 matches but is rejected).
        tableName:
          type: string
          pattern: "^[a-zA-Z0-9_.-]{3,255}$"
          description: DynamoDB rules table the Lambda@Edge reads for this target.
    Target:
      description: A registered target. `id` is server-generated and immutable.
      type: object
      additionalProperties: false
      required: [id, name, region, tableName]
      properties:
        id:
          type: string
          description: Server-generated id; used as the targetId in rule routes.
        name:
          type: string
        region:
          type: string
        tableName:
          type: string
    Rule:
      description: A redirect or rewrite rule item, per the shared schemas.
      oneOf:
        - $ref: "../../shared/redirect-rule.schema.json"
        - $ref: "../../shared/rewrite-rule.schema.json"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code the SPA switches on.
            message:
              type: string
              description: Human-readable summary.
            details:
              type: array
              description: Optional structured detail, e.g. validation errors.
              items:
                type: object
  responses:
    BadRequest:
      description: The request was malformed or failed schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: >-
        The path exists but not for this method. The Lambda router owns method
        dispatch — API Gateway forwards every method on a `$default` route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: >-
        Route is defined but its persistence is not implemented yet (ER-203).
        This is the only response the rule routes return today.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
