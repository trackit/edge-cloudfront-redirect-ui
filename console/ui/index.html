<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdgeRoute — CloudFront Redirect &amp; Rewrite Rules</title>
    <!-- The theme, set before first paint so a dark-mode user never sees a
         white flash. Same key and fallback as src/domain/theme.tsx. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("edgeroute.theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
